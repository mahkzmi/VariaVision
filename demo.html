<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varia Vision | Live Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #09090B; --surface: #18181B; --gold: #D4A24C; --text: #FAFAFA; --muted: #A1A1AA; --border: #27272A; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
            background-image: radial-gradient(circle at 50% -20%, rgba(212, 162, 76, 0.15), transparent 50%);
        }
        .container {
            max-width: 800px; width: 100%; background: var(--surface); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 32px; font-weight: 800; color: var(--gold); margin-bottom: 8px; letter-spacing: -1px; }
        p.subtitle { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
        .upload-zone {
            border: 2px dashed var(--border); border-radius: 16px; padding: 40px; text-align: center;
            cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; min-height: 250px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .upload-zone:hover { border-color: var(--gold); background: rgba(212, 162, 76, 0.05); }
        .upload-zone input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 48px; margin-bottom: 16px; }
        .upload-text { font-weight: 600; color: var(--text); }
        #preview-image { max-width: 100%; max-height: 400px; border-radius: 12px; display: none; margin: 0 auto; }
        .result-box { margin-top: 24px; padding: 24px; background: #000; border: 1px solid var(--border); border-radius: 16px; display: none; }
        .result-title { font-size: 14px; font-weight: 700; color: var(--gold); margin-bottom: 12px; text-transform: uppercase; }
        .result-json { font-family: monospace; font-size: 13px; color: #A1A1AA; white-space: pre-wrap; line-height: 1.6; }
        .loading { display: none; color: var(--gold); font-weight: 600; margin-top: 24px; text-align: center; }
        .footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--muted); }
        .footer a { color: var(--muted); text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Varia Vision API</h1>
    <p class="subtitle">Upload a field image to see our YOLOv8 weed detection model in action.</p>
    <div class="upload-zone" id="drop-area">
        <input type="file" id="file-input" accept="image/*">
        <div class="upload-icon">📸</div>
        <div class="upload-text">Click or drag an image here</div>
        <img id="preview-image" src="" alt="Preview">
    </div>
    <div class="loading" id="loading">Processing image... (May take 30s on first load)</div>
    <div class="result-box" id="result-box">
        <div class="result-title">Detection Results</div>
        <div class="result-json" id="result-json"></div>
    </div>
    <div class="footer">Built by <a href="https://variastudio.framer.website">Varia Studio</a></div>
</div>
<script>
    const fileInput = document.getElementById('file-input');
    const previewImage = document.getElementById('preview-image');
    const dropArea = document.getElementById('drop-area');
    const loading = document.getElementById('loading');
    const resultBox = document.getElementById('result-box');
    const resultJson = document.getElementById('result-json');
    
    // اینجا لینک API خودت رو گذاشتم
    const API_URL = "https://variavision-1.onrender.com/detect";

    dropArea.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
                dropArea.querySelector('.upload-icon').style.display = 'none';
                dropArea.querySelector('.upload-text').style.display = 'none';
            };
            reader.readAsDataURL(file);
            sendToAPI(file);
        }
    });

    async function sendToAPI(file) {
        loading.style.display = 'block';
        resultBox.style.display = 'none';
        const formData = new FormData();
        formData.append('file', file);
        
        try {
            const response = await fetch(API_URL, { method: 'POST', body: formData });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            
            loading.style.display = 'none';
            resultBox.style.display = 'block';
            resultJson.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            loading.style.display = 'none';
            resultBox.style.display = 'block';
            resultJson.textContent = "Error: " + error.message + "\n\n(Note: Free server might be asleep. Please try again in 30s.)";
        }
    }
</script>
</body>
</html>
