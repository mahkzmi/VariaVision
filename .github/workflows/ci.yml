name: Varia Vision CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight API test dependencies
        run: python -m pip install fastapi python-multipart huggingface_hub pillow httpx
      - name: Compile API and tests
        run: python -m compileall -q main.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
